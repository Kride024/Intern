  <div class="container">
    <h2>Enter Dimensions</h2>
    <form id="dimension-form">
      <p>Width (in feet):</p>
      <input type="number" step="any" name="Width" required />

      <p>Height (in feet):</p>
      <input type="number" step="any" name="height" required />

      <button type="submit">Calculate</button>
    </form>

  <a href="https://wa.me/+919506423475" target="_blank" class="Link-3">
    <img src="https://img.icons8.com/ios-filled/50/ffffff/whatsapp.png" alt="WhatsApp" />
  </a>

  <script>
    const form = document.getElementById('dimension-form');
    const category = localStorage.getItem('selected-Category');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const width = document.querySelector('input[name="Width"]').value;
      const height = document.querySelector('input[name="height"]').value;

      localStorage.setItem('Width', width);
      localStorage.setItem('height', height);

      if (category === 'Window blind') {
        window.location.href = "window bind.html";
      } else {
        window.location.href = "form.html";
      }
    });
  </script>
