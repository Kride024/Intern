<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>One-Time Registration Popup</title>
  <style>
    .reg-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .reg-modal-content {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      position: relative;
    }

    .reg-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
    }

    .reg-label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }

    .reg-input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .reg-button {
      width: 100%;
      margin-top: 20px;
      background-color: #f16e84;
      border: none;
      color: white;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .reg-button:hover {
      background-color: #d95c73;
    }

    #reg-status {
      margin-top: 10px;
      font-size: 14px;
      color: green;
    }

    /* Optional reset button for testing */
    #reset-popup {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background-color: #444;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0.6;
    }

    #reset-popup:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- Inject popup only if not already submitted -->
<script>
  if (!localStorage.getItem('regFormSubmitted')) {
    document.write(`
      <div id="reg-popup-form" class="reg-modal" style="display: flex;">
        <div class="reg-modal-content">
          <span class="reg-close" onclick="regCloseModal()">&times;</span>
          <h2>Register Now</h2>
          <form id="reg-form">
            <label class="reg-label" for="reg-name">Full Name</label>
            <input class="reg-input" type="text" id="reg-name" name="name" required placeholder="Enter your name" />

            <label class="reg-label" for="reg-email">Email Address</label>
            <input class="reg-input" type="email" id="reg-email" name="email" required placeholder="Enter your email" />

            <label class="reg-label" for="reg-phone">Mobile Number</label>
            <input class="reg-input" type="tel" id="reg-phone" name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number" />

            <label class="reg-label" for="reg-property">City</label>
            <input class="reg-input" type="text" id="reg-property" name="property" required placeholder="Enter your city" />

            <button class="reg-button" type="submit">Submit</button>
            <div id="reg-status"></div>
          </form>
        </div>
      </div>
    `);
  }
</script>

<!-- Optional Reset Button for Testing -->
<button id="reset-popup" onclick="localStorage.removeItem('regFormSubmitted'); location.reload();">
  Reset Popup
</button>

<script>
  const regUrl = 'https://script.google.com/macros/s/AKfycbxSy2h4rG5HO5xcST5tLPKKMidjfb-IHP0wmW0-uXXJeeeSqBPmcoEjjnOOmnfG1Q0jfQ/exec';

  function regCloseModal() {
    const modal = document.getElementById('reg-popup-form');
    if (modal) modal.style.display = 'none';
  }

  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('reg-form');
    const status = document.getElementById('reg-status');

    if (!form) return;

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      status.textContent = 'Submitting...';

      const formData = new FormData(form);

      fetch(regUrl, {
        method: 'POST',
        body: formData
      })
        .then(response => response.text())
        .then(data => {
          status.textContent = 'Submitted successfully!';
          localStorage.setItem('regFormSubmitted', 'true');
          setTimeout(() => {
            regCloseModal();
            form.reset();
          }, 1000);
        })
        .catch(error => {
          status.textContent = 'Submission failed!';
          console.error(error);
        });
    });
  });
</script>

</body>
</html>
