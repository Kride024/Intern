  * {

    body {

      border-radius: 1rem;

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-30px);}
      to { opacity: 1; transform: translateY(0);}
    }
    
     p{

     }
    button {
      padding: 1rem 2.5rem;

      box-shadow: 0 4px 24px rgba(235,89,95,0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {

    }

 .Link-1, .Link-2, .Link-3 {
