  <div class="container">
    <h2>Choose the type of project</h2>
    <form action="step2.html" method="get" id="form">
      <label class="image-option" for="Residential">
        <div>
          <input type="radio" name="projectType" value="Residential" id="Residential" checked>
          <p>Residential</p>
        </div>
      </label>
      <label class="image-option" for="Commercial">
        <div>
          <input type="radio" id="Commercial" name="projectType" value="Commercial">
          <p>Commercial</p>
        </div>
      </label>
      <label class="image-option" for="Renovation">
        <div>
          <input type="radio" name="projectType" value="Renovation" id="Renovation">
          <p>Renovation</p>
        </div>
      </label>
      <button type="submit">Next</button>
    </form>

   <a href="https://wa.me/+919506423475" target="_blank"  class="Link-3">
  <img src="https://img.icons8.com/ios-filled/50/ffffff/whatsapp.png" alt="WhatsApp"  >
</a>
  <script>
    const form = document.getElementById('form');
    const Residential = document.getElementById('Residential');
    const Commercial = document.getElementById('Commercial');
    const Renovation = document.getElementById('Renovation');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      localStorage.clear();
      const ResidentialValue = Residential.checked;
      const CommercialValue = Commercial.checked;
      const RenovationValue = Renovation.checked;

      localStorage.setItem('Residential', ResidentialValue);
      localStorage.setItem('Commercial', CommercialValue);
      localStorage.setItem('Renovation', RenovationValue);
      if (RenovationValue === true) {
        window.location.href = 'form.html';
      } else if (ResidentialValue === true) {
        window.location.href = 'step2.html';
      } else {
        window.location.href = 'step21.html';
      }
    });
  </script>
