  <script>
    function showOptions() {
      const category = localStorage.getItem('selected-Category');
      const select = document.getElementById('options');
      const subOptionsDiv = document.getElementById('Sub-Options');
      const imageGrid = document.querySelector('.image-grid');
      subOptionsDiv.textContent = category ? `${category}` : 'Sub-Options';

      if (!category) {
        alert('Category not selected. Redirecting to Step 2.');
        window.location.href = 'step2.html';
        return;
      }

      select.innerHTML = '';
      imageGrid.innerHTML = '';

      let options = [];

      if (category === 'False Ceiling Designs') {
        if (localStorage.getItem('Residential') === "true") {
          options = ['POP False Ceiling', 'Gypsum Board False Ceiling', 'Soffit Ceiling'];
        } else if (localStorage.getItem('Commercial') === "true") {
          options = ['POP False Ceiling', 'Gypsum Board False Ceiling', 'Soffit Ceiling', 'Gypsum Grid False Ceiling', 'Metal Ceiling', 'Mineral Fiber Ceiling', 'Baffle Ceiling'];
        }
      } else if (category === 'Flooring Designs') {
        options = ['Wooden Flooring', 'LVT (Luxury Vinyl Tile)', 'Tiles Flooring', 'Artificial Turf', 'Carpet Tiles'];
      } else if (category === 'Window Designs') {
        options = ['uPVC Sliding Window', 'uPVC Casement Window', 'Powder Coated Aluminum Sliding Window', 'Powder Coated Aluminum Casement window', 'Glazing Window'];
      } else if (category === 'Door Designs') {
        options = ['Powder Coated Aluminum Door', 'Glass Door'];
      } else if (category === 'Wall Designs') {
        options = ['WPC Wainscoting', 'WPC Louvers', 'Charcoal Panel', 'Wall Punning', 'Wall Painting', 'Wall Covering', 'PVC Panel', 'Vertical Garden'];
      } else if (category === 'Interior Designs') {
        if (localStorage.getItem('Residential') === "true") {
          options = ['2BHK', '3BHK', 'Bedrooms', 'Living Room', 'Modular Kitchen', 'Kids Room', 'Terrace Garden'];
        } else if (localStorage.getItem('Commercial') === "true") {
          options = ['Office Interior', 'Showroom Interior', 'Jewelry Shop Interior', 'Parlour Interior', 'Restaurant Interior', 'School Interior'];
        }
      } else if (category === 'Window blind') {
        options = ['Roller Blind', 'Roman Blind', 'Vertical Blind', 'Venetian Blind', 'Zebra Blind', 'Honeycomb Blind'];
      } else {
        alert('Invalid category selected.');
        return;
      }

      options.forEach(opt => {
        const el = document.createElement('option');
        el.value = opt;
        el.textContent = opt;
        select.appendChild(el);
      });
    }

    function handleSubmit(event) {
      event.preventDefault();
      const selectedOption = document.getElementById('options').value;
      localStorage.setItem('selected-SubOption', selectedOption);
      const category = localStorage.getItem('selected-Category');

      if (category === 'Window blind') {
        window.location.href = 'window bind.html';
      } else if (['Wall Designs', 'Window Designs', 'Door Designs'].includes(category)) {
        window.location.href = 'step41.html';
      } else if (category === 'Interior Designs') {
        window.location.href = 'step_interior.html';
      } else {
        window.location.href = 'step4.html';
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      showOptions();
      document.getElementById('form').addEventListener('submit', handleSubmit);
    });
  </script>
