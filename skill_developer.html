<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apply Now</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #eef2f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-wrapper {
      width: 100%;
      max-width: 480px;
      background-color: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      margin: 1rem;
    }

    h2.section-common-heading {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }

    .hiringForm_field {
      margin-bottom: 1.2rem;
    }

    .hiringForm_field label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .hiringForm_field input,
    .hiringForm_field select,
    .hiringForm_field textarea {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    small {
      color: red;
      display: none;
      margin-top: 0.25rem;
    }

    #hiringForm_submit {
      width: 100%;
      padding: 0.75rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    #hiringForm_submit:hover {
      background-color: #0056b3;
    }

    #hiringForm_success {
      display: none;
      margin-top: 1rem;
      color: green;
      text-align: center;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .form-wrapper {
        padding: 1.5rem;
      }

      h2.section-common-heading {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <form id="hiringForm_form">
      <h2 class="section-common-heading">Apply Now</h2>

      <div class="hiringForm_field">
        <label for="hiringForm_name">Full Name</label>
        <input type="text" id="hiringForm_name" name="name" required>
      </div>

      <div class="hiringForm_field">
        <label for="hiringForm_email">Email</label>
        <input type="email" id="hiringForm_email" name="email" required oninput="validateEmail()">
        <small id="email_error">Invalid email format</small>
      </div>

      <div class="hiringForm_field">
        <label for="hiringForm_phone">Phone Number</label>
        <input type="tel" id="hiringForm_phone" name="phone" required oninput="validatePhone()">
        <small id="phone_error">Invalid phone format</small>
      </div>

      <div class="hiringForm_field">
        <label for="hiringForm_position">Position Applied For</label>
        <select id="hiringForm_position" name="position" required>
          <option value="">Select a position</option>
          <option value="developer">Developer</option>
          <option value="designer">Designer</option>
          <option value="manager">Project Manager</option>
        </select>
      </div>

      <div class="hiringForm_field">
        <label for="hiringForm_resume">Resume Link</label>
        <input type="url" id="hiringForm_resume" name="resume" placeholder="e.g., Google Drive or Dropbox link" required>
      </div>

      <div class="hiringForm_field">
        <label for="hiringForm_message">Why do you want to join us?</label>
        <textarea id="hiringForm_message" name="message" rows="4"></textarea>
      </div>

      <button id="hiringForm_submit" type="submit">Submit Application</button>
      <p id="hiringForm_success">Thank you! Your application has been received.</p>
    </form>
  </div>
   <!-- ========== Start Footer Section ========== -->





   <!-- ========== End Footer Section ========== -->

 

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      document.getElementById('hiringForm_success').style.display = 'block';
    }

    function validateEmail() {
      const email = document.getElementById("hiringForm_email").value;
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      document.getElementById("email_error").style.display = regex.test(email) ? "none" : "block";
    }

    function validatePhone() {
      const phone = document.getElementById("hiringForm_phone").value;
      const regex = /^[0-9]{10}$/;
      document.getElementById("phone_error").style.display = regex.test(phone) ? "none" : "block";
    }

    function validateFile() {
      const file = document.getElementById("hiringForm_resume").files[0];
      if (file) {
        const validTypes = ["application/pdf", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"];
        document.getElementById("file_error").style.display = validTypes.includes(file.type) ? "none" : "block";
      }
    }


    
  const url = 'https://script.google.com/macros/s/AKfycbwBylxYgSQ4qnSKs9bdembG8r7oX-OjJ-EwydGzNK2bpOTvyQLIm8WnpM--ZcfY6fU3vg/exec';
  const form = document.querySelector('#hiringForm_form');
  const button = form.querySelector('button');

  form.addEventListener('submit', function (e) {
    e.preventDefault(); // Prevent default form submission

    button.innerHTML = "Submitting...";
    button.disabled = true;

    const formData = new FormData(form);

    fetch(url, {
      method: 'POST',
      body: formData,
    })
    .then((res) => res.text())
    .then((responseText) => {
      button.innerHTML = "Sent!";
     // Optional: show success message
      form.reset();
    })
    .catch((error) => {
      console.error("Error!", error.message);
      button.innerHTML = "Failed. Try Again";
    })
    .finally(() => {
      button.disabled = false;
    });
  });

 
  document.getElementById('btn').addEventListener('click',(e)=>{
    e.preventDefault();
  localStorage.clear();
    localStorage.setItem('booked',true);
    window.location.href='form.html';

  })


</script>


</body>
</html>
